name: Release

# Releases are made only from SIGNED builds. Push a tag like v0.1.0-beta.1 (it must match the
# version in package.json) to release. A pull request or a manual run with "dry run" ticked
# builds unsigned installers to prove the pipeline works and publishes nothing.
# Setup and the launch checklist are in docs/releasing.md.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build unsigned and publish nothing. Untick to rehearse a signed build, or to test the signing gate.'
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'build/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DRY: ${{ inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            dry=false
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error title=Tag does not match the version::Tag $REF_NAME but package.json says $version. Tag v$version, or change the version first."
              exit 1
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            dry="$INPUT_DRY"
          else
            dry=true
          fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Mode: dry_run=$dry, version=$version"

  # Refuses to go on unless every signing credential exists (scripts/signing-gate.js).
  # Only runs for real (non dry-run) builds.
  gate:
    name: Signing credentials present
    needs: plan
    if: needs.plan.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/signing-gate.js

  test:
    name: Test (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    name: Build (${{ matrix.label }})
    needs: [plan, gate, test]
    # gate is skipped on a dry run, which must not stop the build
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.test.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows }
          - { os: macos-latest, label: macos }
          - { os: ubuntu-latest, label: linux }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ---- dry run: unsigned, nothing published ----
      - name: Build (unsigned dry run)
        if: needs.plan.outputs.dry_run == 'true'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          case "${{ matrix.label }}" in
            windows) flag=--win ;;
            macos) flag=--mac ;;
            linux) flag=--linux ;;
          esac
          npx electron-builder $flag --publish never

      # ---- real build: signed ----
      # Azure Artifact Signing is used when its account is configured, otherwise the certificate file.
      - name: Build and sign (Windows)
        if: needs.plan.outputs.dry_run == 'false' && matrix.label == 'windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$AZURE_SIGNING_ACCOUNT" ]; then
            echo "Signing with Azure Artifact Signing"
            unset CSC_LINK CSC_KEY_PASSWORD
            npx electron-builder --win --publish never -c.win.signAndEditExecutable=true               "-c.win.azureSignOptions.publisherName=$AZURE_PUBLISHER_NAME"               "-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT"               "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_PROFILE"               "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT"
          else
            echo "Signing with the certificate file"
            npx electron-builder --win --publish never -c.win.signAndEditExecutable=true
          fi

      - name: Build, sign and notarize (macOS)
        if: needs.plan.outputs.dry_run == 'false' && matrix.label == 'macos'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder --mac --publish never -c.mac.notarize=true

      # Linux has no OS-level code signing; its integrity check is the published SHA-256 sums.
      - name: Build (Linux)
        if: needs.plan.outputs.dry_run == 'false' && matrix.label == 'linux'
        run: npx electron-builder --linux --publish never

      # ---- verify the signatures really are valid; a build that fails here is never released ----
      - name: Verify Windows signature
        if: needs.plan.outputs.dry_run == 'false' && matrix.label == 'windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter *.exe
          $files += Get-Item dist/win-unpacked/Freshwater.exe
          if ($files.Count -lt 2) { throw 'No Windows executables found to verify' }
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($s.Status) ($($s.SignerCertificate.Subject))"
            if ($s.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad Windows executable(s) are not validly signed" }

      - name: Verify macOS signature and notarization
        if: needs.plan.outputs.dry_run == 'false' && matrix.label == 'macos'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(dist/mac*/Freshwater.app)
          if [ ${#apps[@]} -eq 0 ]; then echo "::error::No macOS app found to verify"; exit 1; fi
          for app in "${apps[@]}"; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      - name: Checksums
        shell: bash
        run: node scripts/checksums.js dist "dist/SHA256SUMS-${{ matrix.label }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: freshwater-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  # Creates a DRAFT release for you to read and publish. Only for a real run on a tag.
  release:
    name: Draft release
    needs: [plan, build]
    if: ${{ needs.plan.outputs.dry_run == 'false' && github.ref_type == 'tag' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l release-files
          args=(--draft --title "Freshwater $TAG" --generate-notes)
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" release-files/* "${args[@]}"
          echo "Draft release created. Review it, then publish it from the Releases page."
