name: Feature request
description: Suggest a change to the widget.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Freshwater stays local, never limits token use and never guesses. The fish never die. [CONTRIBUTING.md](https://github.com/UnforGBeast/codegreen/blob/main/CONTRIBUTING.md#what-the-project-promises) explains these limits.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you suggest
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered
    validations:
      required: false
